### model
model_name_or_path: ../hf_download/models/Qwen3.5-9B
image_max_pixels: 65536    # 256x256; matches rollout image resolution
trust_remote_code: true
flash_attn: fa2

### method
stage: sft
do_train: true
finetuning_type: lora
freeze_vision_tower: true
freeze_multi_modal_projector: false

### LoRA
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.05
lora_target: all

### dataset
# RoboLab 12 任务混训（v3 prompt）。12 条不同的自然语言指令：
#   Put the {orange,red,blue,green,yellow} block in the bowl   颜色/外观泛化
#   Put the orange block in the {left,right} bowl              空间关系
#   Put the {cube,soup can} in the bowl                        物体类别
#   Put the small red yogurt in the red bowl / canned food in the grey bin / Throw away the apple
# 主任务 OrangeBlockInBowl 20 集,其余各 10 集。
dataset: robolab_0805_12task
template: qwen3_5_nothink
cutoff_len: 2048
overwrite_cache: true      # 图片被原地覆盖时 fingerprint 察觉不到（只 hash 路径字符串）
preprocessing_num_workers: 4
dataloader_num_workers: 2

### output
output_dir: saves/qwen3.5-9b/robot/robolab_0805_12task
logging_steps: 2
save_steps: 200
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: wandb
project: llamafactory
wandb_entity: aaroncaozj_team
run_name: qwen3.5-9b-robot-robolab_0805_12task

### train
# 7559 samples (130 集 x ~58 步,含每集 1 个合成 DONE)。12 个任务的样本分布：
#   OrangeBlock 1099 (主, 20集) | ThrowAwayApple 976 | CannedFood 618
#   Red/Green 563 | Yellow 559 | Blue 554 | Yogurt 551 | BlockLeft 536
#   SoupCan 523 | RubiksCube 510 | BlockRight 507
# 2 H200, batch=4, grad_acc=4 -> eff_bs=32 -> ~236 steps/epoch
# 30 epochs ≈ 7080 steps
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
learning_rate: 1.0e-4
num_train_epochs: 30.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000

### distributed (ZeRO-2: 9B×bf16=18GB fits in H200 141GB, less comm overhead)
deepspeed: examples/deepspeed/ds_z2_config.json
